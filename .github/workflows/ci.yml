name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.changeset/**'
      - '!packages/**/scripts/**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    outputs:
      release_changed: ${{ steps.changed.outputs.release_changed }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "install=true" >> "$GITHUB_OUTPUT"
            echo "lint=true" >> "$GITHUB_OUTPUT"
            echo "lib=true" >> "$GITHUB_OUTPUT"
            echo "demo=true" >> "$GITHUB_OUTPUT"
            echo "release_changed=false" >> "$GITHUB_OUTPUT"
            echo "changeset_added=false" >> "$GITHUB_OUTPUT"
            echo "check_changesets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff against the PR's actual base branch. --no-renames reports a rename
          # as delete + add, so both the old and the new path are seen; no
          # --diff-filter, so deletions count as changes too.
          BASE="origin/$BASE_REF"
          STATUS="$(git diff --name-status --no-renames "$(git merge-base "$BASE" HEAD)")"
          FILES="$(printf '%s\n' "$STATUS" | cut -f2- | sed '/^$/d')"

          echo "Changed files (vs $BASE):"
          printf '%s\n' "$STATUS"

          # Docs never trigger a verify step.
          DOCS_ONLY_RE='(\.md$|^docs/|^LICENSE$)'
          # Workspace-wide inputs (dependencies, toolchain, this workflow): verify everything.
          SHARED_RE='^(package\.json|pnpm-[^/]+\.yaml|biome\.json|\.nvmrc|\.npmrc|\.github/workflows/ci\.yml)$'
          # Library sources, tests, scripts and configs.
          LIB_RE='^packages/'
          # Apps (the demo bundles the library, so library changes rebuild it too).
          APPS_RE='^apps/'
          # Files Biome checks (see files.includes in biome.json).
          LINT_RE='\.(js|mjs|cjs|ts|tsx)$'
          # Paths that change the published package and therefore need a changeset.
          # Must match changedFilePatterns in .changeset/config.json (which are
          # relative to the package directory).
          RELEASE_RE='^packages/pfadfinder/(src/|package\.json$)'
          CHANGESET_RE='^\.changeset/[^/]+\.md$'

          # Capture matches instead of piping into `grep -q`: with pipefail, an early
          # grep exit can SIGPIPE the producer and turn a match into a failure.
          RELEASE_FILES="$(printf '%s\n' "$FILES" | grep -E "$RELEASE_RE" || true)"
          NON_DOCS_FILES="$(printf '%s\n' "$FILES" | grep -vE "$DOCS_ONLY_RE" || true)"
          SHARED_FILES="$(printf '%s\n' "$NON_DOCS_FILES" | grep -E "$SHARED_RE" || true)"
          LIB_FILES="$(printf '%s\n' "$NON_DOCS_FILES" | grep -E "$LIB_RE" || true)"
          APPS_FILES="$(printf '%s\n' "$NON_DOCS_FILES" | grep -E "$APPS_RE" || true)"
          LINT_FILES="$(printf '%s\n' "$NON_DOCS_FILES" | grep -E "$LINT_RE" || true)"
          # Only added/modified changesets count; deleting one never bumps a version.
          ADDED_CHANGESETS="$(printf '%s\n' "$STATUS" \
            | awk -F'\t' '$1 ~ /^[AM]$/ { print $2 }' \
            | grep -E "$CHANGESET_RE" | grep -vE '^\.changeset/README\.md$' || true)"

          if [ -n "$RELEASE_FILES" ]; then
            echo "release_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_changed=false" >> "$GITHUB_OUTPUT"
          fi

          LIB=false; DEMO=false; LINT=false
          if [ -n "$SHARED_FILES" ]; then LIB=true; DEMO=true; LINT=true; fi
          # Release files always verify the library (and need the install for `changeset status`).
          if [ -n "$LIB_FILES" ] || [ -n "$RELEASE_FILES" ]; then LIB=true; DEMO=true; fi
          if [ -n "$APPS_FILES" ]; then DEMO=true; fi
          if [ -n "$LINT_FILES" ] || [ -n "$LIB_FILES" ] || [ -n "$APPS_FILES" ]; then LINT=true; fi

          INSTALL=false
          if [ "$LIB" = "true" ] || [ "$DEMO" = "true" ] || [ "$LINT" = "true" ]; then INSTALL=true; fi

          {
            echo "install=$INSTALL"
            echo "lint=$LINT"
            echo "lib=$LIB"
            echo "demo=$DEMO"
          } >> "$GITHUB_OUTPUT"
          echo "Verify scopes: lint=$LINT lib=$LIB demo=$DEMO"
          if [ "$INSTALL" = "false" ]; then
            echo "::notice::No verify-relevant files changed. Skipping dependency install and verify steps."
          fi

          if [ -n "$ADDED_CHANGESETS" ]; then
            echo "changeset_added=true" >> "$GITHUB_OUTPUT"
          else
            echo "changeset_added=false" >> "$GITHUB_OUTPUT"
          fi

          # The version PR opened by the release workflow bumps package.json and
          # consumes the changesets itself; the rules do not apply to it.
          case "$HEAD_REF" in
            changeset-release/*) echo "check_changesets=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "check_changesets=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install pnpm
        if: steps.changed.outputs.install == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changed.outputs.install == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        if: steps.changed.outputs.install == 'true'
        run: pnpm install --frozen-lockfile

      - name: Changeset rules
        if: steps.changed.outputs.check_changesets == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          RELEASE_CHANGED: ${{ steps.changed.outputs.release_changed }}
          CHANGESET_ADDED: ${{ steps.changed.outputs.changeset_added }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_CHANGED" = "true" ]; then
            pnpm exec changeset status --since="origin/$BASE_REF" --verbose
          elif [ "$CHANGESET_ADDED" = "true" ]; then
            echo "::error::Changeset added or modified, but no files under packages/pfadfinder/src/ or packages/pfadfinder/package.json changed. Version bumps are only allowed for package changes."
            exit 1
          fi

      - name: Lint
        if: steps.changed.outputs.lint == 'true'
        run: pnpm lint

      # The demo consumes the library from its built dist output.
      - name: Build library
        if: steps.changed.outputs.lib == 'true' || steps.changed.outputs.demo == 'true'
        run: pnpm build

      - name: Typecheck library
        if: steps.changed.outputs.lib == 'true'
        run: pnpm --filter @leptoquark1/openage-pfadfinder typecheck

      - name: Typecheck demo
        if: steps.changed.outputs.demo == 'true'
        run: pnpm --filter @leptoquark1/openage-pfadfinder-demo typecheck

      - name: Test library (with coverage thresholds)
        if: steps.changed.outputs.lib == 'true'
        run: pnpm --filter @leptoquark1/openage-pfadfinder test:coverage

      - name: Test demo
        if: steps.changed.outputs.demo == 'true'
        run: pnpm --filter @leptoquark1/openage-pfadfinder-demo test

      - name: Build demo
        if: steps.changed.outputs.demo == 'true'
        run: pnpm --filter @leptoquark1/openage-pfadfinder-demo build

      - name: Validate package
        if: steps.changed.outputs.lib == 'true'
        run: pnpm check:package

  benchmark:
    name: Benchmark vs. latest release
    needs: verify
    # Only package changes can change the performance of the published library.
    if: needs.verify.outputs.release_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds this PR, fetches the latest release from npm and measures both on
      # this runner. Exit code 1: the release is faster beyond the 5 % noise
      # margin. The Markdown matrix goes to the job summary.
      - name: Compare with the latest release
        run: pnpm --reporter=silent benchmark latest >> "$GITHUB_STEP_SUMMARY"
