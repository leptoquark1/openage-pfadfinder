name: '🔀 Gemini Dispatch'

# Gemini PR review only: runs when a PR is opened or new commits are pushed to
# it (only if code-relevant paths changed, see `paths`), or on demand with a
# `@gemini-cli /review [context]` comment on a PR.

on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
    paths:
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'biome.json'
      - '.nvmrc'
      - '.npmrc'
      # Markdown (docs, READMEs, changesets) alone never needs a code review.
      - '!**/*.md'
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'

  dispatch:
    # Opened PRs: not from a fork and not from Dependabot (no access to the
    # Gemini secrets). Comments: `@gemini-cli /review` on a PR, only from
    # OWNER/MEMBER/COLLABORATOR. Disable Gemini entirely by setting the
    # repository variable `GEMINI_REVIEW_ENABLED` to `false`.
    if: |-
      vars.GEMINI_REVIEW_ENABLED != 'false' && (
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      ) || (
        github.event.sender.type == 'User' &&
        (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
        startsWith(github.event.comment.body || github.event.review.body, '@gemini-cli /review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
      )
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    outputs:
      additional_context: '${{ steps.extract_context.outputs.additional_context }}'
    steps:
      - name: 'Extract context'
        id: 'extract_context'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # ratchet:actions/github-script@v9
        env:
          REQUEST: '${{ github.event.comment.body || github.event.review.body }}'
        with:
          script: |
            // Anything after `@gemini-cli /review` is passed to the review as context.
            const request = process.env.REQUEST || '';
            core.setOutput('additional_context', request.replace(/^@gemini-cli \/review/, '').trim());

  review:
    needs: 'dispatch'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'
