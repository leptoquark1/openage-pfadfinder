name: '🤖 Claude Code Review'

# PR code review with Claude, for maintainers (OWNER/MEMBER/COLLABORATOR) only:
# - automatically when a maintainer's PR is opened or new commits are pushed to
#   it, but only if code-relevant paths changed (see `paths`);
# - on demand with a `@claude /review` comment on a PR from a maintainer.
# Disable it by setting the repository variable `CLAUDE_REVIEW_ENABLED` to
# `false`.

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'ready_for_review'
      - 'reopened'
    paths:
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'biome.json'
      - '.nvmrc'
      - '.npmrc'
      # Markdown (docs, READMEs, changesets) alone never needs a code review.
      - '!**/*.md'
  issue_comment:
    types:
      - 'created'

jobs:
  claude-review:
    # Automatic: PRs by a maintainer, not drafts, not from a fork (no access to
    # the Claude secrets). Manual: `@claude /review` comment on a PR by a
    # maintainer.
    if: |-
      vars.CLAUDE_REVIEW_ENABLED != 'false' && (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.fork == false &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) || (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.sender.type == 'User' &&
          startsWith(github.event.comment.body, '@claude /review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    # Job-level, so unrelated PR comments (skipped runs) never cancel a review.
    concurrency:
      group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}'
      cancel-in-progress: true
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
      pull-requests: 'read'
      issues: 'read'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 'Run Claude Code Review'
        uses: 'anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f' # ratchet:anthropics/claude-code-action@v1
        with:
          # Set one of these secrets (`claude setup-token` or /install-github-app creates the OAuth token).
          claude_code_oauth_token: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
          anthropic_api_key: '${{ secrets.ANTHROPIC_API_KEY }}'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin only prints its findings to the (hidden) log.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }} --comment'
          claude_args: "--model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}"
