name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: next
        run: |
          pnpm exec changeset status --output=changeset-status.json
          # "minor version 2.1.0" for the library, other packages appended as "crowd 0.1.0"
          release=$(node -p "
            const rs = require('./changeset-status.json').releases.filter(r => r.type !== 'none');
            const core = rs.find(r => r.name === '@leptoquark1/openage-pfadfinder');
            const rest = rs.filter(r => r !== core).map(r => r.name.replace('@leptoquark1/openage-pfadfinder-', '') + ' ' + r.newVersion);
            [core ? core.type + ' version ' + core.newVersion : '', ...rest].filter(Boolean).join(', ')
          ")
          rm changeset-status.json
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore(release): ${{ steps.next.outputs.release }}"
          pr-title: "chore(release): ${{ steps.next.outputs.release }}"
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
