name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: next
        run: |
          pnpm exec changeset status --output=changeset-status.json
          release=$(node -p "const r = require('./changeset-status.json').releases.find(r => r.name === '@leptoquark1/openage-pfadfinder'); r ? r.type + ' version ' + r.newVersion : ''")
          rm changeset-status.json
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore(release): ${{ steps.next.outputs.release }}"
          pr-title: "chore(release): ${{ steps.next.outputs.release }}"
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
