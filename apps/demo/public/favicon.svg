<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="openAge Pfadfinder">
  <!-- Panel background, theme colours: panel #14181c, border-strong #333b43 -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#14181c" stroke="#333b43" stroke-width="1.5"/>
  <!-- Path: a mob (teal, mob colour) walks a stepped route to the target -->
  <polyline points="8.5,23.5 8.5,16 16,16 16,9.5 19.5,9.5" fill="none" stroke="#4fd1c5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8.5" cy="23.5" r="3" fill="#4fd1c5"/>
  <!-- Target (amber, target colour) -->
  <circle cx="23" cy="9.5" r="4.25" fill="none" stroke="#f5a623" stroke-width="2"/>
  <circle cx="23" cy="9.5" r="1.5" fill="#f5a623"/>
</svg>
